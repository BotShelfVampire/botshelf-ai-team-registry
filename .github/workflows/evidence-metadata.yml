name: Evidence metadata validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/evidence-metadata.yml"
      - "CITATION.cff"
      - "codemeta.json"
      - "docs/evidence-record.schema.json"
      - "examples/evidence-record*.json"
      - "scripts/validate_metadata.py"
  pull_request:
    paths:
      - ".github/workflows/evidence-metadata.yml"
      - "CITATION.cff"
      - "codemeta.json"
      - "docs/evidence-record.schema.json"
      - "examples/evidence-record*.json"
      - "scripts/validate_metadata.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public evidence metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "jsonschema[format-nongpl]==4.25.1"

      - name: Validate evidence and discovery metadata
        run: python scripts/validate_metadata.py
